<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flower Breath · 素材对照</title><style>body{max-width:1200px;margin:32px auto;padding:20px;color:#dce8e4;background:#09131e;font:14px/1.7 system-ui}h1{font-weight:300}section{margin:30px 0}article{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%;border-radius:8px}figure{margin:0}figcaption{color:#99adaa;margin:6px 0}a{color:#b5deda}@media(max-width:600px){article{grid-template-columns:1fr}}</style><h1>Flower Breath · 处理帧核对</h1><p>保留原视频主体和背景；角落标记使用当前帧邻近背景修补，不复用静止首帧，并做轻度锐化。以下为应用实际读取的闭合与展开端点。</p><main id="list"></main><p><a href="/">返回花境</a></p><script>fetch('/videos/manifest.json').then(r=>r.json()).then(data=>{document.querySelector('#list').innerHTML=data.map(f=>`<section><h2>${f.name}</h2><article><figure><img style="${f.packedBubbles?'aspect-ratio:16/9;object-fit:cover;object-position:left':''}" src="${f.framePath}/000.${f.frameExtension??'jpg'}"><figcaption>闭合 · 原视频 ${f.closed.toFixed(3)} 秒</figcaption></figure><figure><img style="${f.packedBubbles?'aspect-ratio:16/9;object-fit:cover;object-position:left':''}" src="${f.framePath}/${String(f.frames-1).padStart(3,'0')}.${f.frameExtension??'jpg'}"><figcaption>展开 · 原视频 ${f.open.toFixed(3)} 秒</figcaption></figure></article></section>`).join('')})</script></html>
